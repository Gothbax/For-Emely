<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Emely</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #ffffff;
    --tinta: #000000;
    --grafito: #3b3b3b;
    --ceniza: #8a8a8a;
    --niebla: #e9e9e9;
    --display: "Cormorant Garamond", "Palatino Linotype", Georgia, serif;
    --texto: "Jost", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--texto);
    color: var(--tinta);
    background: var(--papel);
    overflow-x: hidden;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }

  /* corazones finos que suben */
  .fondo { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .fondo svg { position: absolute; bottom: -40px; opacity: 0; animation: subir linear infinite; }
  @keyframes subir {
    0% { transform: translateY(0) rotate(-8deg); opacity: 0; }
    12% { opacity: .5; }
    100% { transform: translateY(-110vh) rotate(14deg); opacity: 0; }
  }

  .pantalla {
    position: relative; z-index: 1;
    min-height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 32px 22px;
  }
  .oculto { display: none !important; }

  /* ---------- 1. sobre ---------- */
  .sobre { width: clamp(110px, 30vw, 160px); height: auto; margin-bottom: 26px; animation: flota 3.2s ease-in-out infinite; }
  @keyframes flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .intro h1 {
    font-family: var(--display); font-weight: 400; font-style: italic;
    font-size: clamp(34px, 8vw, 58px); line-height: 1.1; margin: 0 0 12px;
  }
  .intro p { margin: 0 0 34px; color: var(--grafito); font-size: clamp(15px, 3.6vw, 18px); font-weight: 400; }

  .btn {
    font-family: var(--texto); font-weight: 500; cursor: pointer;
    border: 1px solid var(--tinta); border-radius: 0;
    padding: .95em 2.4em; font-size: 1rem; letter-spacing: .02em;
    background: var(--tinta); color: var(--papel);
    transition: background .2s ease, color .2s ease, transform .15s ease;
  }
  .btn:hover { background: var(--papel); color: var(--tinta); }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 2px solid var(--tinta); outline-offset: 4px; }

  /* ---------- 2. propuesta ---------- */
  .propuesta h2 {
    font-family: var(--display); font-weight: 400; font-style: italic;
    font-size: clamp(38px, 9vw, 84px); line-height: 1.08;
    margin: 0 0 14px; max-width: 13em;
  }
  .propuesta .sub { margin: 0 0 44px; color: var(--grafito); font-size: clamp(15px, 3.6vw, 18px); min-height: 1.6em; }
  .botones { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: center; max-width: 100%; }
  #si {
    font-size: var(--si-tam, 1.05rem);
    padding: calc(var(--si-tam, 1.05rem) * .9) calc(var(--si-tam, 1.05rem) * 2.4);
    transition: font-size .4s cubic-bezier(.3, 1.5, .5, 1), padding .4s cubic-bezier(.3, 1.5, .5, 1), background .2s, color .2s;
    max-width: 100%;
  }
  #si.gigante {
    position: fixed; inset: 0; z-index: 20; width: 100%; height: 100%;
    border: 0; padding: 0;
    font-family: var(--display); font-style: italic; font-weight: 400;
    font-size: clamp(90px, 30vw, 340px);
    display: flex; align-items: center; justify-content: center;
    background: var(--tinta); color: var(--papel);
  }
  #no { background: transparent; color: var(--tinta); }
  #no:hover { background: var(--tinta); color: var(--papel); }
  #no.tiembla { animation: tiembla .35s; }
  @keyframes tiembla {
    20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
  }

  /* ---------- 3. celebración ---------- */
  .celebracion { position: fixed; inset: 0; z-index: 30; overflow: hidden; background: var(--tinta); color: var(--papel); }
  .celebracion .contenido { position: relative; z-index: 2; width: 100%; }
  .te-amo {
    font-family: var(--display); font-style: italic; font-weight: 400;
    font-size: clamp(64px, 19vw, 170px); line-height: 1.05; margin: 0;
    animation: aparece 1.1s cubic-bezier(.2, .9, .3, 1) both;
  }
  @keyframes aparece { from { opacity: 0; transform: translateY(24px) scale(.96); letter-spacing: .08em; } to { opacity: 1; transform: none; letter-spacing: 0; } }
  .gatos { display: flex; justify-content: center; align-items: flex-end; gap: clamp(0px, 1.5vw, 18px); margin-top: 26px; flex-wrap: nowrap; }
  .gatos .cat { width: clamp(58px, 17vw, 150px); height: auto; overflow: visible; }
  .caida { position: absolute; top: -40px; z-index: 1; animation: caer linear forwards; opacity: .85; }
  @keyframes caer { to { transform: translateY(115vh) rotate(300deg); } }

  /* ---------- gatitos bailando ---------- */
  .cat { transform-origin: 50% 100%; animation: baile .8s var(--d, 0s) ease-in-out infinite alternate; }
  .cat .cabeza { transform-box: fill-box; transform-origin: 50% 90%; animation: cabeceo .4s var(--d, 0s) ease-in-out infinite alternate; }
  .cat .brazo { transform-box: fill-box; transform-origin: 50% 100%; animation: brazo .4s var(--d, 0s) ease-in-out infinite alternate; }
  .cat .brazo.der { animation-direction: alternate-reverse; }
  .cat .cola { transform-box: fill-box; transform-origin: 0% 100%; animation: cola .5s var(--d, 0s) ease-in-out infinite alternate; }
  @keyframes baile { from { transform: translateY(0) rotate(-7deg); } to { transform: translateY(-16px) rotate(7deg); } }
  @keyframes cabeceo { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
  @keyframes brazo { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
  @keyframes cola { from { transform: rotate(-18deg); } to { transform: rotate(14deg); } }

  /* ---------- música ---------- */
  .musica {
    position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); z-index: 50;
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
    background: var(--papel); color: var(--tinta); border: 1px solid var(--tinta);
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .musica svg { width: 20px; height: 20px; }
  .musica:focus-visible { outline: 2px solid var(--tinta); outline-offset: 3px; }
  .musica.sobre-negro { background: var(--tinta); color: var(--papel); border-color: var(--papel); }

  @media (prefers-reduced-motion: reduce) {
    .fondo svg, .sobre, .caida { animation: none; }
    .fondo svg { opacity: .2; bottom: 20%; }
    .cat, .cat * { animation-duration: 2.4s !important; }
    .te-amo { animation: none; }
  }
</style>
</head>
<body>

<div class="fondo" id="fondo" aria-hidden="true"></div>

<audio id="audio" src="careless-whisper.mp3" loop preload="auto"></audio>
<button class="musica oculto" id="btnMusica" aria-label="Silenciar o activar la música"></button>

<!-- 1. sobre -->
<main class="pantalla intro" id="intro">
  <svg class="sobre" viewBox="0 0 160 112" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
    <rect x="6" y="10" width="148" height="92"/>
    <path d="M6 10 L80 66 L154 10"/>
    <path d="M6 102 L58 52 M154 102 L102 52"/>
    <path d="M80 44 c-4-7-14-4-12 4 c2 7 12 12 12 12 s10-5 12-12 c2-8-8-11-12-4z" fill="#000" stroke="none"/>
  </svg>
  <h1>Emely, tengo algo para ti</h1>
  <p>Sube el volumen y ábrelo con calma.</p>
  <button class="btn" id="abrir">Abrir</button>
</main>

<!-- 2. propuesta -->
<main class="pantalla propuesta oculto" id="propuesta">
  <h2>¿Quieres ser mi novia, Emely?</h2>
  <p class="sub" id="sub">Solo hay una respuesta correcta.</p>
  <div class="botones">
    <button class="btn" id="si">Sí</button>
    <button class="btn" id="no">No</button>
  </div>
</main>

<!-- 3. celebración -->
<section class="pantalla celebracion oculto" id="celebracion" aria-live="polite">
  <div class="contenido">
    <p class="te-amo">Te amoo &lt;3</p>
    <div class="gatos" id="gatos" aria-hidden="true"></div>
  </div>
</section>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var audio = $('audio');

  /* corazón en línea fina (SVG) */
  var CORAZON = 'M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 4.5 6.6 4.5c2 0 3.4 1.1 4.2 2.4h.4c.8-1.3 2.2-2.4 4.2-2.4 3.6 0 5.7 3.8 4.2 7.3C19.5 16.4 12 21 12 21z';
  function corazon(tam, color, relleno) {
    return '<svg width="' + tam + '" height="' + tam + '" viewBox="0 0 24 24" fill="' + (relleno ? color : 'none') +
           '" stroke="' + color + '" stroke-width="1.4" stroke-linejoin="round"><path d="' + CORAZON + '"/></svg>';
  }

  /* corazones de fondo (pantallas claras) */
  var fondo = $('fondo');
  for (var i = 0; i < 14; i++) {
    var w = document.createElement('div');
    w.innerHTML = corazon(16 + Math.floor(Math.random() * 22), '#8a8a8a', false);
    var s = w.firstChild;
    s.style.left = (Math.random() * 100) + '%';
    s.style.animationDuration = (10 + Math.random() * 10) + 's';
    s.style.animationDelay = (-Math.random() * 16) + 's';
    fondo.appendChild(s);
  }

  /* gatito en SVG, en escala de grises */
  function gato(pelo, panza, tinta, retraso) {
    var borde = ' stroke="#fff" stroke-width="1.6" stroke-linejoin="round"';
    return '' +
    '<svg class="cat" viewBox="0 0 120 150" style="--d:' + retraso + 's">' +
      '<g class="cola"><path d="M86 122 C114 116 120 88 104 78" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>' +
        '<path d="M86 122 C114 116 120 88 104 78" fill="none" stroke="' + pelo + '" stroke-width="10" stroke-linecap="round"/></g>' +
      '<ellipse cx="46" cy="140" rx="14" ry="8" fill="' + pelo + '"' + borde + '/>' +
      '<ellipse cx="74" cy="140" rx="14" ry="8" fill="' + pelo + '"' + borde + '/>' +
      '<g class="brazo izq"><path d="M38 98 C22 88 18 70 24 58" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>' +
        '<path d="M38 98 C22 88 18 70 24 58" fill="none" stroke="' + pelo + '" stroke-width="10" stroke-linecap="round"/></g>' +
      '<g class="brazo der"><path d="M82 98 C98 88 102 70 96 58" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>' +
        '<path d="M82 98 C98 88 102 70 96 58" fill="none" stroke="' + pelo + '" stroke-width="10" stroke-linecap="round"/></g>' +
      '<ellipse cx="60" cy="110" rx="28" ry="32" fill="' + pelo + '"' + borde + '/>' +
      '<ellipse cx="60" cy="116" rx="15" ry="21" fill="' + panza + '"/>' +
      '<g class="cabeza">' +
        '<polygon points="34,42 38,10 60,30" fill="' + pelo + '"' + borde + '/>' +
        '<polygon points="86,42 82,10 60,30" fill="' + pelo + '"' + borde + '/>' +
        '<polygon points="40,36 42,19 54,30" fill="' + panza + '"/>' +
        '<polygon points="80,36 78,19 66,30" fill="' + panza + '"/>' +
        '<ellipse cx="60" cy="50" rx="31" ry="26" fill="' + pelo + '"' + borde + '/>' +
        '<path d="M43 48 q5 -8 11 0" fill="none" stroke="' + tinta + '" stroke-width="3" stroke-linecap="round"/>' +
        '<path d="M66 48 q5 -8 11 0" fill="none" stroke="' + tinta + '" stroke-width="3" stroke-linecap="round"/>' +
        '<polygon points="56,55 64,55 60,60" fill="' + tinta + '"/>' +
        '<path d="M60 60 v3 M60 63 q-4 5 -9 1 M60 63 q4 5 9 1" fill="none" stroke="' + tinta + '" stroke-width="2" stroke-linecap="round"/>' +
        '<path d="M30 56 l-14 -3 M30 60 l-14 3 M90 56 l14 -3 M90 60 l14 3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>' +
      '</g>' +
    '</svg>';
  }
  /* [pelo, panza, tinta de ojos y nariz] */
  var paleta = [
    ['#ffffff', '#d4d4d4', '#000'], ['#a8a8a8', '#e6e6e6', '#000'], ['#ffffff', '#bdbdbd', '#000'],
    ['#4a4a4a', '#9a9a9a', '#fff'], ['#d4d4d4', '#ffffff', '#000']
  ];
  $('gatos').innerHTML = paleta.map(function (p, i) {
    return gato(p[0], p[1], p[2], (i * 0.17).toFixed(2));
  }).join('');

  /* música */
  var sonando = false;
  var btnMusica = $('btnMusica');
  var ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  var ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  function icono() { btnMusica.innerHTML = audio.muted ? ICON_OFF : ICON_ON; }
  icono();
  function reproducir() {
    try {
      var p = audio.play();
      if (p && p.then) { p.then(function () { sonando = true; icono(); }).catch(function () {}); }
      else { sonando = true; icono(); }
    } catch (e) {}
  }
  btnMusica.addEventListener('click', function () {
    if (!sonando) { reproducir(); return; }
    audio.muted = !audio.muted;
    icono();
  });

  /* abrir */
  $('abrir').addEventListener('click', function () {
    $('intro').classList.add('oculto');
    $('propuesta').classList.remove('oculto');
    btnMusica.classList.remove('oculto');
    audio.volume = 0.8;
    reproducir();
  });

  /* botón No: el Sí crece */
  var frases = [
    '¿Segura?', 'Piénsalo bien', 'Mira que te quiero mucho', 'Los gatitos se ponen tristes',
    'No me hagas llorar', 'Última oportunidad', 'Anda, di que sí', 'Por favorcito', 'Ya casi no tienes opción'
  ];
  var subs = [
    'Solo hay una respuesta correcta.', 'Creo que se te movió el dedo.', 'Mira lo grande que se ve el Sí.',
    'Prometo ser el mejor novio.', 'El Sí te está esperando.', 'Hasta el botón del Sí se emociona.',
    'Te lo voy a seguir preguntando.', 'Cada vez cabe menos el No.', 'Ya casi, ya casi.'
  ];
  var intentos = 0, MAX = 9;
  var si = $('si'), no = $('no'), sub = $('sub');
  no.addEventListener('click', function () {
    intentos++;
    no.classList.remove('tiembla'); void no.offsetWidth; no.classList.add('tiembla');
    no.textContent = frases[(intentos - 1) % frases.length];
    sub.textContent = subs[Math.min(intentos, subs.length - 1)];
    if (intentos >= MAX) { si.classList.add('gigante'); }
    else { si.style.setProperty('--si-tam', (1.05 + intentos * 0.8) + 'rem'); }
  });

  /* botón Sí: celebración */
  function lluvia() {
    var cont = $('celebracion');
    for (var i = 0; i < 34; i++) {
      var w = document.createElement('div');
      var lleno = Math.random() > .5;
      w.innerHTML = corazon(16 + Math.floor(Math.random() * 26), Math.random() > .4 ? '#ffffff' : '#9a9a9a', lleno);
      var c = w.firstChild;
      c.setAttribute('class', 'caida');
      c.style.left = (Math.random() * 100) + '%';
      c.style.animationDuration = (3.5 + Math.random() * 4) + 's';
      c.style.animationDelay = (Math.random() * 3) + 's';
      cont.appendChild(c);
    }
    setTimeout(lluvia, 7800);
  }
  var celebrando = false;
  si.addEventListener('click', function () {
    if (celebrando) return;
    celebrando = true;
    si.classList.remove('gigante');
    $('propuesta').classList.add('oculto');
    $('fondo').classList.add('oculto');
    $('celebracion').classList.remove('oculto');
    btnMusica.classList.add('sobre-negro');
    audio.muted = false; icono();
    if (audio.paused) reproducir();
    lluvia();
  });
})();
</script>
</body>
</html>
